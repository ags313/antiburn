[workspace]

[package]
name = "antiburn-remote"
version = "0.10.0"
edition = "2024"
description = "Bounded, read-only Linux and Windows helper for importing Antiburn sessions over SSH."
license = "MIT"
repository = "https://github.com/antiburn/antiburn"
publish = false

[dependencies]
antiburn-local = { path = "../antiburn-local" }
anyhow = "1"
# The same version as antiburn-local, so Cargo builds one SQLite copy.
rusqlite = { version = "0.32.1", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "sync", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The same version as antiburn-local, so Cargo builds one copy.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
time = "0.3"
